name: Reminder scadenze

on:
  schedule:
    - cron: "0 7 * * *" # ogni giorno alle 07:00 UTC
  workflow_dispatch:
    inputs:
      giorni_preavviso:
        description: "Giorni di preavviso (utile per testare con scadenze più lontane)"
        required: false
        default: "30"

jobs:
  reminder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r reminder/requirements.txt
      - run: python reminder/check_scadenze.py
        env:
          GIORNI_PREAVVISO: ${{ github.event.inputs.giorni_preavviso || '30' }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
